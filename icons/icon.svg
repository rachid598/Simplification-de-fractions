<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Numerator -->
  <text x="256" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="150" font-weight="bold" fill="#fffffe">6</text>
  <!-- Fraction bar -->
  <line x1="155" y1="260" x2="357" y2="260" stroke="#a7a9be" stroke-width="10" stroke-linecap="round"/>
  <!-- Denominator -->
  <text x="256" y="415" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="150" font-weight="bold" fill="#fffffe">8</text>
  <!-- Strike line -->
  <line x1="110" y1="400" x2="402" y2="112" stroke="#e94560" stroke-width="14" stroke-linecap="round"/>
</svg>
